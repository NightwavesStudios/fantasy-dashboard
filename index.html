<body>

<div class="app">

    <header>
        <div class="logo">Trade<span>Calc</span></div>
        <div class="subtitle">
            ESPN league + FantasyCalc values
        </div>
    </header>

    <section class="setup">
        <div class="input-row">
            <input
                id="leagueId"
                type="text"
                placeholder="Enter ESPN League ID"
            >
            <button onclick="loadLeague()">Load League</button>
        </div>

        <div id="status" class="status">
            Enter your ESPN league ID to get started.
        </div>
    </section>

    <section id="calculator" class="hidden">

        <div class="trade">

            <div class="side">
                <div class="side-header">
                    <div class="side-title">Your Side</div>
                    <div class="value" id="yourValue">0</div>
                </div>

                <div id="yourSelected" class="selected"></div>

                <input
                    class="search"
                    id="yourSearch"
                    placeholder="Search players..."
                    oninput="renderPlayers('your')"
                >

                <div id="yourPlayers" class="player-list"></div>
            </div>

            <div class="side">
                <div class="side-header">
                    <div class="side-title">Their Side</div>
                    <div class="value" id="theirValue">0</div>
                </div>

                <div id="theirSelected" class="selected"></div>

                <input
                    class="search"
                    id="theirSearch"
                    placeholder="Search players..."
                    oninput="renderPlayers('their')"
                >

                <div id="theirPlayers" class="player-list"></div>
            </div>

        </div>

        <div class="results">
            <div class="result-label">TRADE DIFFERENCE</div>
            <div id="difference" class="result-number even">0</div>
            <div id="resultText" class="result-text">
                Add players to both sides.
            </div>
        </div>

    </section>

    <footer>
        Values powered by FantasyCalc
    </footer>

</div>

<script>
let players = [];
let yourSide = [];
let theirSide = [];

const ESPN_BASE =
    "https://lm-api-reads.fantasy.espn.com/apis/v3/games/ffl/seasons";

async function loadLeague() {

    const leagueId =
        document.getElementById("leagueId").value.trim();

    if (!leagueId) {
        setStatus("Enter a league ID.", true);
        return;
    }

    setStatus("Loading ESPN league...");

    try {

        /*
         * ESPN's public API.
         *
         * We first request mSettings + mTeam + mRoster.
         */

        const url =
            `${ESPN_BASE}/2026/segments/0/leagues/${leagueId}` +
            `?view=mSettings&view=mTeam&view=mRoster`;

        const response = await fetch(url);

        if (!response.ok) {
            throw new Error(
                `ESPN returned ${response.status}`
            );
        }

        const league = await response.json();

        if (!league.teams) {
            throw new Error(
                "League data was not returned. Make sure the league is public."
            );
        }

        /*
         * Pull every rostered ESPN player.
         */

        const rostered = [];

        for (const team of league.teams) {

            if (!team.roster || !team.roster.entries)
                continue;

            for (const entry of team.roster.entries) {

                const player =
                    entry.playerPoolEntry?.player;

                if (!player)
                    continue;

                rostered.push({
                    id: player.id,
                    name: player.fullName,
                    position: getPosition(player),
                    team: team.location ||
                          team.name ||
                          "Team"
                });
            }
        }

        /*
         * Remove duplicate ESPN player IDs.
         */

        const unique = new Map();

        for (const player of rostered) {
            unique.set(player.id, player);
        }

        players = [...unique.values()];

        /*
         * FantasyCalc integration.
         *
         * The exact public API endpoint can change, so this
         * implementation attempts the API endpoint first.
         */

        setStatus(
            `Loaded ${players.length} rostered players. Loading values...`
        );

        await loadFantasyCalc();

        document
            .getElementById("calculator")
            .classList.remove("hidden");

        renderPlayers("your");
        renderPlayers("their");

        setStatus(
            `Loaded ${league.settings?.name || "league"} successfully.`,
            false,
            true
        );

    } catch (error) {

        console.error(error);

        setStatus(
            error.message ||
            "Could not load the league.",
            true
        );
    }
}


function getPosition(player) {

    const eligible =
        player.eligibleSlots || [];

    /*
     * ESPN slot IDs:
     * QB = 0
     * RB = 2
     * WR = 4
     * TE = 6
     */

    if (eligible.includes(0))
        return "QB";

    if (eligible.includes(2))
        return "RB";

    if (eligible.includes(4))
        return "WR";

    if (eligible.includes(6))
        return "TE";

    return "FLEX";
}


async function loadFantasyCalc() {

    /*
     * IMPORTANT:
     *
     * Replace this URL with the FantasyCalc API endpoint
     * available to your integration/API key.
     *
     * The rest of the app does not need to change.
     */

    const API_URL =
        "https://api.fantasycalc.com/v1/values";

    try {

        const response = await fetch(API_URL);

        if (!response.ok)
            throw new Error("FantasyCalc API unavailable");

        const data = await response.json();

        /*
         * Expected shape:
         *
         * [
         *   {
         *      name: "Josh Allen",
         *      value: 10000
         *   }
         * ]
         */

        const values = new Map();

        for (const item of data) {

            if (!item.name)
                continue;

            values.set(
                normalize(item.name),
                Number(item.value) || 0
            );
        }

        /*
         * Match FantasyCalc players to ESPN players.
         */

        for (const player of players) {

            player.value =
                values.get(normalize(player.name)) || 0;
        }

    } catch (error) {

        console.warn(
            "FantasyCalc API could not be loaded:",
            error
        );

        /*
         * Temporary fallback so the UI still works.
         */

        for (const player of players) {
            player.value = 0;
        }

        setStatus(
            "ESPN loaded, but FantasyCalc values could not be fetched. Check the API endpoint.",
            true
        );
    }
}


function normalize(name) {

    return name
        .toLowerCase()
        .replace(/[^a-z0-9]/g, "");
}


function renderPlayers(side) {

    const search =
        document
            .getElementById(
                side === "your"
                    ? "yourSearch"
                    : "theirSearch"
            )
            .value
            .toLowerCase();

    const container =
        document.getElementById(
            side === "your"
                ? "yourPlayers"
                : "theirPlayers"
        );

    const selected =
        side === "your"
            ? yourSide
            : theirSide;

    const selectedIds =
        new Set(selected.map(p => p.id));

    const filtered =
        players
            .filter(p =>
                p.name.toLowerCase().includes(search)
            )
            .filter(p =>
                !selectedIds.has(p.id)
            )
            .sort((a,b) =>
                b.value - a.value
            );

    container.innerHTML = "";

    for (const player of filtered) {

        const div =
            document.createElement("div");

        div.className = "player";

        div.innerHTML = `
            <div class="player-info">
                <div class="player-name">
                    ${escapeHTML(player.name)}
                </div>

                <div class="player-meta">
                    ${player.position} · ${escapeHTML(player.team)}
                </div>
            </div>

            <div class="player-value">
                ${player.value || "—"}
            </div>
        `;

        div.onclick = () =>
            addPlayer(side, player);

        container.appendChild(div);
    }
}


function addPlayer(side, player) {

    if (side === "your") {

        if (!yourSide.some(p => p.id === player.id))
            yourSide.push(player);

    } else {

        if (!theirSide.some(p => p.id === player.id))
            theirSide.push(player);
    }

    renderSelected();
    renderPlayers("your");
    renderPlayers("their");
    updateResult();
}


function removePlayer(side, id) {

    if (side === "your") {

        yourSide =
            yourSide.filter(p => p.id !== id);

    } else {

        theirSide =
            theirSide.filter(p => p.id !== id);
    }

    renderSelected();
    renderPlayers("your");
    renderPlayers("their");
    updateResult();
}


function renderSelected() {

    renderSelectedSide(
        "your",
        yourSide
    );

    renderSelectedSide(
        "their",
        theirSide
    );
}


function renderSelectedSide(side, list) {

    const container =
        document.getElementById(
            side === "your"
                ? "yourSelected"
                : "theirSelected"
        );

    container.innerHTML = "";

    for (const player of list) {

        const div =
            document.createElement("div");

        div.className =
            "selected-player";

        div.innerHTML = `
            <span>
                ${escapeHTML(player.name)}
                <small style="color:#a1a1aa">
                    ${player.value}
                </small>
            </span>

            <span class="remove"
                onclick="removePlayer('${side}', ${player.id})">
                ×
            </span>
        `;

        container.appendChild(div);
    }

    const total =
        list.reduce(
            (sum, p) =>
                sum + Number(p.value || 0),
            0
        );

    document.getElementById(
        side === "your"
            ? "yourValue"
            : "theirValue"
    ).textContent = total;
}


function updateResult() {

    const your =
        yourSide.reduce(
            (sum,p) =>
                sum + Number(p.value || 0),
            0
        );

    const their =
        theirSide.reduce(
            (sum,p) =>
                sum + Number(p.value || 0),
            0
        );

    const difference =
        your - their;

    const number =
        document.getElementById("difference");

    const text =
        document.getElementById("resultText");

    number.textContent =
        difference > 0
            ? "+" + difference
            : difference;

    number.className =
        "result-number " +
        (
            difference > 100
                ? "good"
                : difference < -100
                    ? "bad"
                    : "even"
        );

    if (your === 0 && their === 0) {

        text.textContent =
            "Add players to both sides.";

    } else if (Math.abs(difference) <= 100) {

        text.textContent =
            "Pretty even trade.";

    } else if (difference > 0) {

        text.textContent =
            "Your side has more FantasyCalc value.";

    } else {

        text.textContent =
            "Their side has more FantasyCalc value.";
    }
}


function setStatus(message, error=false, success=false) {

    const status =
        document.getElementById("status");

    status.textContent = message;

    status.className =
        "status" +
        (error ? " error" : "") +
        (success ? " success" : "");
}


function escapeHTML(str) {

    return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}
</script>

</body>
</html>
